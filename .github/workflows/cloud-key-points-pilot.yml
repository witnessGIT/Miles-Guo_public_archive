name: Cloud Key Points and Topics Pilot

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of naturally segmented livestreams to summarize
        required: true
        default: '1'
      reprocess_live_id:
        description: Optional completed livestream to regenerate with the current extraction contract
        required: false
        default: ''
      reprocess_empty:
        description: Reprocess completed livestreams whose accepted key-point output is empty
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: miles-guo-cloud-key-points-writer
  cancel-in-progress: false

jobs:
  summarize:
    if: github.actor == 'witnessGIT'
    runs-on: macos-14
    timeout-minutes: 350
    env:
      HF_HOME: /tmp/miles-guo-hf-cache
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache the public enrichment model
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}/hub
          key: cloud-key-points-macos-arm64-qwen2.5-7b-instruct-4bit-v1

      - name: Install free local-inference tools
        run: python -m pip install mlx-lm==0.31.3 opencc-python-reimplemented==0.1.7

      - name: Run claim-bound key-point pilot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          extra_arg=''
          if [[ '${{ inputs.reprocess_empty }}' == 'true' ]]; then
            extra_arg='--reprocess-empty'
          fi
          python scripts/cloud_keypoint_batch.py \
            --repo "$GITHUB_WORKSPACE" \
            --batch-size '${{ inputs.batch_size }}' \
            --reprocess-live-id '${{ inputs.reprocess_live_id }}' \
            ${extra_arg:+"$extra_arg"} \
            --agent-id "github-actions-cloud-key-points-${GITHUB_RUN_ID}"
