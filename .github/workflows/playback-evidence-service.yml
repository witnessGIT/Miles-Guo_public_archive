name: Playback Evidence Service

on:
  push:
    branches: [main]
    paths:
      - 'coordination/playback_requests/**/*.json'
      - 'coordination/playback_acceptances/**/*.json'
      - 'scripts/playback_service_state.py'
      - 'scripts/process_playback_request.py'
      - 'scripts/stamp_playback_evidence.py'
      - 'scripts/accept_playback_evidence.py'
      - 'scripts/audit_gate.py'
      - 'scripts/audit_media.py'
      - '.github/workflows/playback-evidence-service.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miles-guo-playback-evidence-writer
  # Every run checks out fresh main and scans the complete pending queue. The newest run can
  # therefore safely replace an older queued/in-progress run; pending requests remain durable
  # on main and will be picked up again, avoiding redundant installs/compiles per request push.
  # This workflow path is also a recovery trigger: an admin no-op repair commit can re-scan
  # durable pending requests if a prior push event was not scheduled by GitHub Actions.
  cancel-in-progress: true

env:
  WHISPER_CPP_REF: v1.9.4
  WHISPER_MODEL_NAME: small
  CCACHE_DIR: /home/runner/.cache/ccache

jobs:
  process-playback-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # A run may have an old event SHA. Always start from fresh main so it sees durable
          # evidence published earlier and all currently pending requests/acceptances.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-chi-sim ccache
          python -m pip install --upgrade pip
          python -m pip install yt-dlp

      - name: Cache whisper model only
        uses: actions/cache@v4
        with:
          path: ~/.cache/miles-guo-playback/models
          key: playback-${{ runner.os }}-whisper-model-${{ env.WHISPER_CPP_REF }}-${{ env.WHISPER_MODEL_NAME }}

      - name: Cache portable whisper compilation objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: playback-${{ runner.os }}-whisper-ccache-${{ env.WHISPER_CPP_REF }}-ggml-native-off-v1
          restore-keys: |
            playback-${{ runner.os }}-whisper-ccache-${{ env.WHISPER_CPP_REF }}-

      - name: Prepare portable whisper.cpp
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/miles-guo-playback"
          model_root="$root/models"
          tool="$RUNNER_TEMP/whisper.cpp-${WHISPER_CPP_REF}"
          rm -rf "$tool"
          mkdir -p "$model_root" "$CCACHE_DIR"
          ccache --max-size=1G
          ccache --zero-stats
          git clone --depth 1 --branch "$WHISPER_CPP_REF" https://github.com/ggml-org/whisper.cpp.git "$tool"
          cmake -S "$tool" -B "$tool/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGGML_NATIVE=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build "$tool/build" --config Release -j 4
          ccache --show-stats
          model="$model_root/ggml-${WHISPER_MODEL_NAME}.bin"
          if [[ ! -f "$model" ]]; then
            bash "$tool/models/download-ggml-model.sh" "$WHISPER_MODEL_NAME"
            mv "$tool/models/ggml-${WHISPER_MODEL_NAME}.bin" "$model"
          fi
          echo "WHISPER_CLI=$tool/build/bin/whisper-cli" >> "$GITHUB_ENV"
          echo "WHISPER_MODEL=$model" >> "$GITHUB_ENV"

      - name: Detect optional SmolVLM2 requests
        id: visual
        shell: bash
        run: |
          set -euo pipefail
          need="$(python scripts/playback_service_state.py --visual-runtime-needed)"
          echo "need_smolvlm=$need" >> "$GITHUB_OUTPUT"

      - name: Install optional free SmolVLM2 runtime
        if: steps.visual.outputs.need_smolvlm == 'true'
        run: |
          python -m pip install 'transformers>=4.49,<6' accelerate av
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          echo "ENABLE_SMOLVLM=1" >> "$GITHUB_ENV"

      - name: Process truly pending playback requests
        id: requests
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python scripts/playback_service_state.py --prepare-pending-requests > /tmp/playback-requests.txt
          state_rc=$?
          cat /tmp/playback-requests.txt
          if [[ "$state_rc" != "0" ]]; then
            exit "$state_rc"
          fi
          failed=0
          # Snapshot the queue before running media subprocesses. Media tools may read stdin;
          # a `while ... done < file` loop would let one child consume later request lines.
          mapfile -t requests < /tmp/playback-requests.txt
          for request in "${requests[@]}"; do
            [[ -z "$request" ]] && continue
            # A retry may replace prior retryable evidence only after request validation.
            # Stamp the exact request revision only when processing succeeded. Therefore a
            # malformed/unauthorized retry cannot delete or relabel an older evidence bundle.
            if python scripts/process_playback_request.py --request "$request" --force </dev/null; then
              python scripts/stamp_playback_evidence.py --request "$request" </dev/null || failed=1
            else
              failed=1
            fi
          done
          exit "$failed"

      - name: Finalize repository evidence metadata
        id: finalize
        continue-on-error: true
        run: python scripts/playback_service_state.py --finalize-evidence

      - name: Process truly pending worker acceptances
        id: acceptances
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python scripts/playback_service_state.py --pending-acceptances > /tmp/playback-acceptances.txt
          state_rc=$?
          cat /tmp/playback-acceptances.txt
          if [[ "$state_rc" != "0" ]]; then
            exit "$state_rc"
          fi
          failed=0
          mapfile -t acceptances < /tmp/playback-acceptances.txt
          for acceptance in "${acceptances[@]}"; do
            [[ -z "$acceptance" ]] && continue
            python scripts/accept_playback_evidence.py --acceptance "$acceptance" </dev/null || failed=1
          done
          exit "$failed"

      - name: Validate durable playback records
        shell: bash
        run: |
          set +e
          python scripts/audit_gate.py --json > /tmp/pilot60.json
          rc=$?
          set -e
          if [[ "$rc" != "0" && "$rc" != "1" ]]; then
            cat /tmp/pilot60.json || true
            exit "$rc"
          fi
          cat /tmp/pilot60.json
          python - <<'PY'
          import json
          row = json.load(open('/tmp/pilot60.json', encoding='utf-8'))
          if row.get('invalid_records'):
              raise SystemExit('Playback evidence service produced/observed invalid durable records')
          PY

      - name: Commit durable evidence outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in data/playback_evidence data/playback_audits; do
            if [[ -e "$path" ]]; then
              git add -f -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo 'No durable playback evidence changes to commit.'
          else
            git commit -m 'data: publish repository playback evidence'
            published=false
            for attempt in 1 2 3 4 5; do
              # Never carry a failed rebase state into the next retry.
              if [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; then
                git rebase --abort || true
              fi
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                published=true
                break
              fi
              if [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; then
                git rebase --abort || true
              fi
              echo "Playback evidence push race, retry $attempt/5 from a clean rebase state"
              sleep $((attempt * 2))
            done
            if [[ "$published" != "true" ]]; then
              echo 'Failed to publish playback evidence after bounded clean-state race retries.'
              exit 1
            fi
          fi

      - name: Surface request, finalization, or acceptance failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          request_outcome='${{ steps.requests.outcome }}'
          finalize_outcome='${{ steps.finalize.outcome }}'
          acceptance_outcome='${{ steps.acceptances.outcome }}'
          if [[ "$request_outcome" != "success" || "$finalize_outcome" != "success" || "$acceptance_outcome" != "success" ]]; then
            echo "Playback processing had failures: requests=$request_outcome finalize=$finalize_outcome acceptances=$acceptance_outcome"
            echo 'Durable successful/blocked evidence was published first when available.'
            exit 1
          fi
