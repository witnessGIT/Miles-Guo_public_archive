name: Playback Audit Control

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_media.py'
      - 'scripts/playback_validation.py'
      - 'scripts/record_playback_audit.py'
      - 'scripts/process_playback_request.py'
      - 'scripts/accept_playback_evidence.py'
      - 'scripts/playback_service_state.py'
      - 'scripts/stamp_playback_evidence.py'
      - 'scripts/smolvlm_inspect.py'
      - 'scripts/audit_gate.py'
      - 'scripts/playback_queue.py'
      - 'scripts/next_task.py'
      - 'scripts/project_status.py'
      - 'data/current/live_segments/**'
      - 'data/playback_audits/**'
      - 'data/playback_evidence/**'
      - 'coordination/playback_requests/**'
      - 'coordination/playback_acceptances/**'
      - 'coordination/bug_reports/**'
      - 'coordination/invalidated/**'
      - 'coordination/ready/collection/**'
      - 'coordination/ready/alignment/**'
      - 'coordination/completed/P9-PLAYBACK-GATE.json'
      - 'coordination/completed/P9-AUDIT-60-R2.json'
      - 'coordination/completed/P10-PILOT-DECISION-R2.json'
      - 'coordination/WORK_QUEUE.jsonl'
      - 'coordination/WORKFLOW.json'
      - 'START_HERE.md'
      - '.github/workflows/playback-audit-control.yml'
      - '.github/workflows/playback-evidence-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/current/live_segments/**'
      - 'data/playback_audits/**'
      - 'data/playback_evidence/**'
      - 'coordination/playback_requests/**'
      - 'coordination/playback_acceptances/**'
      - 'coordination/WORK_QUEUE.jsonl'
      - '.github/workflows/playback-audit-control.yml'
      - '.github/workflows/playback-evidence-service.yml'

permissions:
  contents: read

jobs:
  validate-playback-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile playback control scripts
        run: |
          python -m py_compile \
            scripts/audit_media.py \
            scripts/playback_validation.py \
            scripts/record_playback_audit.py \
            scripts/process_playback_request.py \
            scripts/accept_playback_evidence.py \
            scripts/playback_service_state.py \
            scripts/stamp_playback_evidence.py \
            scripts/smolvlm_inspect.py \
            scripts/audit_gate.py \
            scripts/playback_queue.py \
            scripts/next_task.py \
            scripts/project_status.py

      - name: Validate audit gate output contract
        shell: bash
        run: |
          set +e
          python scripts/audit_gate.py --json > /tmp/pilot60.json
          rc=$?
          set -e
          if [[ "$rc" != "0" && "$rc" != "1" ]]; then
            echo "audit_gate.py returned unexpected exit code: $rc"
            exit "$rc"
          fi
          python - <<'PY'
          import json
          data = json.load(open('/tmp/pilot60.json', encoding='utf-8'))
          required = {
              'gate', 'qualifying_checks', 'required_checks',
              'invalid_records', 'pilot60_pass', 'canonical_crosscheck'
          }
          missing = sorted(required - set(data))
          if missing:
              raise SystemExit(f'missing audit gate keys: {missing}')
          if data['gate'] != 'P9-AUDIT-60':
              raise SystemExit('unexpected logical audit gate id')
          if data['canonical_crosscheck'] is not True:
              raise SystemExit('canonical crosscheck must be enabled')
          if data.get('invalid_records'):
              raise SystemExit(f"invalid playback records: {data['invalid_records'][:3]}")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Validate playback queue sees repository service
        run: |
          python scripts/playback_queue.py --list
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import playback_queue
          status = playback_queue.capability_status()
          assert status['repository_evidence_service'] is True, status
          print('repository evidence service detected')
          PY

      - name: Validate worker and admin project status output
        run: |
          python scripts/project_status.py --json > /tmp/status-worker.json
          python scripts/project_status.py --role admin --json > /tmp/status-admin.json
          python - <<'PY'
          import json
          worker = json.load(open('/tmp/status-worker.json', encoding='utf-8'))
          admin = json.load(open('/tmp/status-admin.json', encoding='utf-8'))
          required_types = {'ordinary_business', 'real_playback', 'gate_or_report', 'admin_control'}
          if set(worker.get('task_types', {})) != required_types:
              raise SystemExit('worker status missing task type contract')
          if worker.get('role') != 'worker' or admin.get('role') != 'admin':
              raise SystemExit('role classifier mismatch')
          if worker.get('runtime', {}).get('repository_evidence_service') is not True:
              raise SystemExit('worker status did not detect repository playback service')
          if worker.get('gates', {}).get('current_P9_task_id') != 'P9-AUDIT-60-R2':
              raise SystemExit('status classifier is not using current P9 R2 identity')
          if worker.get('gates', {}).get('current_P10_task_id') != 'P10-PILOT-DECISION-R2':
              raise SystemExit('status classifier is not using current P10 R2 identity')
          print('project status role/task-type/repository-service/R2 contract OK')
          PY

      - name: Regression test ordinary worker can use repository playback service without local ffmpeg
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import project_status as ps
          ps.next_task.eligible_tasks = lambda: []
          ps.playback_queue.case_statuses = lambda: [{
              'task_id': 'P9-PLAYBACK-PILOT-X001',
              'case_id': 'PILOT-X001',
              'live_id': 'LIVE_20000101_001',
              'missing_segment_ids': ['LIVE_20000101_001_SEG_000001'],
              'claim_exists': False,
              'completed': False,
          }]
          ps.playback_queue.gate_summary = lambda: {
              'pilot60_pass': False, 'qualifying_checks': 0,
              'required_checks': 60, 'invalid_records': [],
          }
          ps.playback_queue.capability_status = lambda: {
              'ffmpeg': False, 'ffprobe': False, 'yt_dlp': False,
              'repository_evidence_service': True,
          }
          ps.load_admin_bug_queue = lambda: ([], [])
          ps.exists_completed = lambda task_id: False
          ps.exists_claim = lambda task_id: False
          ps.load_completed = lambda task_id: None
          status = ps.build_status(False, 'worker')
          assert status['classification'] == 'WORK_AVAILABLE', status
          assert status['runtime']['playback_capable'] is True, status
          assert status['recommended_action'] == 'CLAIM_REAL_PLAYBACK_TASK_AND_REQUEST_REPOSITORY_EVIDENCE', status
          assert status['host_stop_for_this_runtime'] is False, status
          print('ordinary-agent repository playback regression OK')
          PY

      - name: Regression test gate-pass outranks leftover playback work
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import project_status as ps
          ps.next_task.eligible_tasks = lambda: []
          ps.playback_queue.case_statuses = lambda: [{
              'task_id': 'P9-PLAYBACK-PILOT-X001', 'case_id': 'PILOT-X001',
              'live_id': 'LIVE_20000101_001',
              'missing_segment_ids': ['LIVE_20000101_001_SEG_000001'],
              'claim_exists': False, 'completed': False,
          }]
          ps.playback_queue.gate_summary = lambda: {
              'pilot60_pass': True, 'qualifying_checks': 60,
              'required_checks': 60, 'invalid_records': [],
          }
          ps.playback_queue.capability_status = lambda: {
              'ffmpeg': False, 'ffprobe': False, 'yt_dlp': False,
              'repository_evidence_service': True,
          }
          ps.load_admin_bug_queue = lambda: ([], [])
          ps.exists_completed = lambda task_id: False
          ps.exists_claim = lambda task_id: False
          ps.load_completed = lambda task_id: None
          status = ps.build_status(False, 'worker')
          assert status['state'] == 'PLAYBACK_GATE_READY_TO_SEAL', status
          assert status['recommended_action'] == 'SEAL_P9_PLAYBACK_GATE', status
          print('gate-pass precedence regression OK')
          PY

      - name: Regression test admin bug work outranks playback
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import project_status as ps
          ps.next_task.eligible_tasks = lambda: []
          ps.playback_queue.case_statuses = lambda: [{
              'task_id': 'P9-PLAYBACK-PILOT-X001', 'case_id': 'PILOT-X001',
              'live_id': 'LIVE_20000101_001',
              'missing_segment_ids': ['LIVE_20000101_001_SEG_000001'],
              'claim_exists': False, 'completed': False,
          }]
          ps.playback_queue.gate_summary = lambda: {
              'pilot60_pass': False, 'qualifying_checks': 0,
              'required_checks': 60, 'invalid_records': [],
          }
          ps.playback_queue.capability_status = lambda: {
              'ffmpeg': False, 'ffprobe': False, 'yt_dlp': False,
              'repository_evidence_service': True,
          }
          ps.load_admin_bug_queue = lambda: ([{'bug_id': 'BUG_TEST', 'status': 'open'}], [])
          ps.exists_completed = lambda task_id: False
          ps.exists_claim = lambda task_id: False
          ps.load_completed = lambda task_id: None
          admin = ps.build_status(False, 'admin')
          assert admin['recommended_action'] == 'ADMIN_REVIEW_BUG_QUEUE', admin
          worker = ps.build_status(False, 'worker')
          assert worker['classification'] == 'WORK_AVAILABLE', worker
          print('admin priority + worker playback availability regression OK')
          PY

      - name: Regression test superseded legacy gates are never eligible
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import next_task as nt
          ids = {row['id'] for row in nt.static_tasks(nt.completed_ids())}
          forbidden = {'P9-AUDIT-60', 'P10-PILOT-DECISION'} & ids
          if forbidden:
              raise SystemExit(f'superseded legacy tasks became eligible: {sorted(forbidden)}')
          print('superseded gate suppression OK')
          PY

      - name: Regression test stale claims cannot bypass R2 finish dependencies
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import next_task as nt
          nt.load_queue = lambda: [{
              'id': 'P9-AUDIT-60-R2', 'kind': 'qa_gate',
              'depends_on': ['P9-PLAYBACK-GATE'],
          }]
          nt.completed_ids = lambda: set()
          try:
              nt.validate_finish_prerequisites('P9-AUDIT-60-R2')
          except SystemExit as exc:
              if 'latest queue prerequisites are incomplete' not in str(exc):
                  raise
          else:
              raise SystemExit('finish guard failed to block stale R2 P9 claim')
          print('R2 finish-time dependency regression OK')
          PY

      - name: Assert authoritative R2 P9 and P10 completion integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          completed = Path('coordination/completed')
          sentinel = completed / 'P9-PLAYBACK-GATE.json'
          p9 = completed / 'P9-AUDIT-60-R2.json'
          p10 = completed / 'P10-PILOT-DECISION-R2.json'
          if p9.exists():
              if not sentinel.exists():
                  raise SystemExit('authoritative R2 P9 exists without P9-PLAYBACK-GATE')
              s = json.loads(sentinel.read_text(encoding='utf-8'))
              if (s.get('validation') or {}).get('pilot60_pass') is not True:
                  raise SystemExit('P9-PLAYBACK-GATE does not prove pilot60_pass=true')
              row = json.loads(p9.read_text(encoding='utf-8'))
              if row.get('finish_prerequisites_revalidated') is not True:
                  raise SystemExit('R2 P9 lacks finish-time prerequisite revalidation')
          if p10.exists():
              if not p9.exists():
                  raise SystemExit('authoritative R2 P10 exists without authoritative R2 P9')
              row = json.loads(p10.read_text(encoding='utf-8'))
              if row.get('full_archive_decision') not in {'YES', 'NO'}:
                  raise SystemExit('R2 P10 lacks full_archive_decision=YES|NO')
          print('authoritative R2 P9/P10 integrity OK')
          PY

      - name: Assert current P9 cannot be claimed before playback gate
        shell: bash
        run: |
          python scripts/next_task.py --list > /tmp/eligible_tasks.txt
          cat /tmp/eligible_tasks.txt
          if grep -q '^P9-AUDIT-60 ' /tmp/eligible_tasks.txt || grep -q '^P10-PILOT-DECISION ' /tmp/eligible_tasks.txt; then
            echo 'Superseded legacy P9/P10 identity appeared in eligible task list.'
            exit 1
          fi
          if [[ ! -f coordination/completed/P9-PLAYBACK-GATE.json ]] && grep -q '^P9-AUDIT-60-R2 ' /tmp/eligible_tasks.txt; then
            echo 'P9-AUDIT-60-R2 became eligible before P9-PLAYBACK-GATE was sealed.'
            exit 1
          fi
