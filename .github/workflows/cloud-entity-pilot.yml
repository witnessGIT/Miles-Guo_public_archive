name: Cloud Entity Enrichment Pilot

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Number of naturally segmented livestreams to enrich
        required: true
        default: '50'
      live_ids:
        description: Optional comma-separated LIVE ids shared with the key-point batch
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: miles-guo-cloud-entity-writer
  cancel-in-progress: false

jobs:
  enrich:
    if: github.actor == 'witnessGIT'
    runs-on: macos-14
    timeout-minutes: 350
    env:
      HF_HOME: /tmp/miles-guo-hf-cache
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache the public enrichment model
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}/hub
          key: cloud-entity-macos-arm64-qwen2.5-7b-instruct-4bit-v1

      - name: Install free local-inference tools
        run: python -m pip install mlx-lm==0.31.3

      - name: Run claim-bound entity pilot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/cloud_entity_batch.py \
            --repo "$GITHUB_WORKSPACE" \
            --batch-size '${{ inputs.batch_size }}' \
            --live-ids '${{ inputs.live_ids }}' \
            --agent-id "github-actions-cloud-entity-${GITHUB_RUN_ID}"
