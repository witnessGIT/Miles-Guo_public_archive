name: One-shot C2 lease repair

on:
  push:
    branches: ['agents/admin-c2-effective-lease-20261005']
    paths: ['.github/workflows/admin-c2-lease-bootstrap.yml']

permissions:
  contents: write

jobs:
  verified-lease-repair:
    if: github.repository == 'witnessGIT/Miles-Guo_public_archive' && github.actor == 'witnessGIT'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm original scheduler regression
        run: |
          test "$(git hash-object scripts/next_task.py)" = e9b21dd6a494480acb22bfa348b9fe421365495d
          test "$(git hash-object scripts/validate_candidate_reviews.py)" = 98b3ee344f779da2261d83c66cbad957a044e6b4
          if PYTHONPATH=tests python -m unittest test_c2_effective_lease_contract.C2EffectiveLeaseTests.test_missing_static_field_expires_at_ten_hours -v; then
            echo 'Expected ten-hour expiry regression was not reproduced; refusing patch.'
            exit 1
          fi
      - name: Apply exact hash-bound repair
        run: python scripts/admin_apply_c2_lease_once.py
      - name: Run sixteen focused lease regressions
        run: python -m unittest discover -s tests -p 'test_c2_effective_lease_contract.py' -v
      - name: Preserve claims, completion history and archive inputs
        run: git diff --exit-code -- data coordination/claims coordination/completed
      - name: Validate candidate evidence and rebuilt database
        run: |
          python scripts/validate_candidate_reviews.py
          python scripts/build_db.py
          python scripts/validate_db.py
      - name: Publish only repaired source and remove temporary bootstrap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/admin_apply_c2_lease_once.py .github/workflows/admin-c2-lease-bootstrap.yml
          git add scripts/next_task.py scripts/validate_candidate_reviews.py
          python - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          expected = {'scripts/next_task.py', 'scripts/validate_candidate_reviews.py', 'scripts/admin_apply_c2_lease_once.py', '.github/workflows/admin-c2-lease-bootstrap.yml'}
          if actual != expected:
              raise SystemExit(f'Refusing unexpected staged paths: {actual}')
          PY
          git commit -m 'fix: unify C2 lease scheduling, display and validation at ten hours'
          git push origin HEAD:refs/heads/agents/admin-c2-effective-lease-20261005
