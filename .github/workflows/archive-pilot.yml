name: archive-pilot

on:
  push:
    branches:
      - main
      - archive/pilot-001
    paths:
      - '.github/workflows/archive-pilot.yml'
      - 'scripts/**'
      - 'schema/**'
      - 'requirements.txt'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-validate-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild Pilot SQLite from Git-tracked source data
        run: python scripts/build_db.py

      - name: Validate Pilot SQLite
        run: python scripts/validate_db.py

      - name: Commit rebuilt Pilot database
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "Miles-Guo_public_archive bot"
          git config user.email "actions@users.noreply.github.com"
          git add database/Miles-Guo_public_archive.sqlite3
          if git diff --cached --quiet; then
            echo "No generated database changes"
          else
            git commit -m "data: rebuild Pilot archive database"
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
