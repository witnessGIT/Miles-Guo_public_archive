name: Admin Visual Match Patch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-visual-match-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch playback OCR candidate support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/process_playback_request.py')
          text = p.read_text(encoding='utf-8')
          marker = '\ndef frame_offsets(window: float, expected_local: float) -> list[float]:\n'
          insert = """
          def best_ocr_match(frames: list[dict], target: str, search_text: str | None) -> dict | None:
              \"\"\"Find a conservative target-text candidate in sampled frame OCR.\"\"\"
              target_norm = normalize_text(target)
              if len(target_norm) < 4 or not frames:
                  return None
              keywords = keyword_tokens(search_text)
              best: dict | None = None
              for frame in frames:
                  raw = str(frame.get('ocr_text') or '')
                  lines = [line.strip() for line in raw.splitlines() if normalize_text(line)]
                  if not lines:
                      continue
                  max_window = min(3, len(lines))
                  for i in range(len(lines)):
                      for width in range(1, max_window + 1):
                          part = lines[i : i + width]
                          if not part:
                              continue
                          combined = ' '.join(part)
                          combined_norm = normalize_text(combined)
                          if len(combined_norm) < 4:
                              continue
                          ratio = difflib.SequenceMatcher(None, target_norm, combined_norm).ratio()
                          coverage = 0.0
                          if keywords:
                              hits = sum(1 for token in keywords if token in combined_norm)
                              coverage = hits / len(keywords)
                          score = max(ratio, ratio * 0.75 + coverage * 0.25)
                          candidate = {
                              'local_sec': float(frame.get('local_sec') or 0.0),
                              'absolute_sec': float(frame.get('absolute_sec') or 0.0),
                              'text': combined,
                              'similarity': round(ratio, 6),
                              'keyword_coverage': round(coverage, 6),
                              'score': round(score, 6),
                              'line_count': len(part),
                              'frame_sha256': frame.get('sha256'),
                          }
                          if best is None or candidate['score'] > best['score']:
                              best = candidate
              return best
          """
          import textwrap
          insert = '\n' + textwrap.dedent(insert).strip() + '\n'
          if 'def best_ocr_match(' not in text:
              if marker not in text:
                  raise SystemExit('process patch marker 1 not found')
              text = text.replace(marker, insert + marker, 1)

          old = '''    match = best_asr_match(entries, target_text, segment.get("text_search"))
    decode_start = float(decode.get("decode_start_sec", expected))
    decode_window = float(decode.get("decode_window_sec", window))
    decode_end = decode_start + decode_window
    observed = round(decode_start + float(match["local_start_sec"]), 3) if match else None
    timing_error = round(observed - expected, 3) if observed is not None else None

    frames = collect_frame_evidence(clip, temp_dir, decode_start, expected, decode_window)
    smolvlm = run_optional_smolvlm(
        clip, temp_dir,
        bool(request.get("visual_mode") == "smolvlm2_optional" and os.environ.get("ENABLE_SMOLVLM") == "1"),
    )
    candidate_match = bool(match and float(match.get("score", 0.0)) >= MIN_AGENT_REVIEW_SCORE)
    status = "ready_for_agent_review" if candidate_match else "needs_manual_or_wider_review"
'''
          new = '''    match = best_asr_match(entries, target_text, segment.get("text_search"))
    decode_start = float(decode.get("decode_start_sec", expected))
    decode_window = float(decode.get("decode_window_sec", window))
    decode_end = decode_start + decode_window

    frames = collect_frame_evidence(clip, temp_dir, decode_start, expected, decode_window)
    visual_match = best_ocr_match(frames, target_text, segment.get("text_search"))
    smolvlm = run_optional_smolvlm(
        clip, temp_dir,
        bool(request.get("visual_mode") == "smolvlm2_optional" and os.environ.get("ENABLE_SMOLVLM") == "1"),
    )
    candidates: list[tuple[str, dict]] = []
    if match:
        candidates.append(("audio_asr", match))
    if visual_match:
        candidates.append(("frame_ocr", visual_match))
    candidate_method, candidate = max(
        candidates, key=lambda item: float(item[1].get("score", 0.0))
    ) if candidates else (None, None)
    candidate_score = float((candidate or {}).get("score", 0.0))
    if candidate_method == "frame_ocr":
        observed = round(float(candidate["absolute_sec"]), 3)
    elif candidate_method == "audio_asr":
        observed = round(decode_start + float(candidate["local_start_sec"]), 3)
    else:
        observed = None
    timing_error = round(observed - expected, 3) if observed is not None else None
    candidate_match = bool(candidate and candidate_score >= MIN_AGENT_REVIEW_SCORE)
    status = "ready_for_agent_review" if candidate_match else "needs_manual_or_wider_review"
'''
          if old not in text:
              raise SystemExit('process patch marker 2 not found')
          text = text.replace(old, new, 1)
          old = '        "visual_evidence": {"frames": frames, "smolvlm": smolvlm},\n        "candidate_content_match": candidate_match,\n'
          new = '        "visual_evidence": {"frames": frames, "best_match": visual_match, "smolvlm": smolvlm},\n        "candidate_match_method": candidate_method,\n        "candidate_match_score": round(candidate_score, 6),\n        "candidate_content_match": candidate_match,\n'
          if old not in text:
              raise SystemExit('process patch marker 3 not found')
          text = text.replace(old, new, 1)
          old = '    print(f"status={status} score={(match or {}).get(\'score\')} observed={observed}")\n'
          new = '    print(f"status={status} method={candidate_method} score={candidate_score:.6f} observed={observed}")\n'
          if old not in text:
              raise SystemExit('process patch marker 4 not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          a = Path('scripts/accept_playback_evidence.py')
          text = a.read_text(encoding='utf-8')
          old = '''    match = (evidence.get("audio_asr") or {}).get("best_match") or {}
    score = float(match.get("score") or 0.0)
    minimum = float(evidence.get("minimum_agent_review_score") or 1.0)
    if score < minimum:
        raise ValueError(f"ASR match score {score} is below evidence minimum {minimum}")
'''
          new = '''    match_method = str(evidence.get("candidate_match_method") or "audio_asr")
    if match_method == "frame_ocr":
        match = (evidence.get("visual_evidence") or {}).get("best_match") or {}
    elif match_method == "audio_asr":
        match = (evidence.get("audio_asr") or {}).get("best_match") or {}
    else:
        raise ValueError(f"unsupported candidate_match_method: {match_method!r}")
    score = float(evidence.get("candidate_match_score") or match.get("score") or 0.0)
    minimum = float(evidence.get("minimum_agent_review_score") or 1.0)
    if score < minimum:
        raise ValueError(
            f"candidate match score {score} via {match_method} is below evidence minimum {minimum}"
        )
'''
          if old not in text:
              raise SystemExit('accept patch marker 1 not found')
          text = text.replace(old, new, 1)
          old = '        "observation_mode": "audio" if not (evidence.get("visual_evidence") or {}).get("frames") else "both",\n'
          new = '        "observation_mode": "visual" if match_method == "frame_ocr" else ("audio" if not (evidence.get("visual_evidence") or {}).get("frames") else "both"),\n'
          if old not in text:
              raise SystemExit('accept patch marker 2 not found')
          text = text.replace(old, new, 1)
          old = '        "repository_asr_match_score": score,\n        "repository_minimum_review_score": minimum,\n'
          new = '        "repository_candidate_match_method": match_method,\n        "repository_candidate_match_score": score,\n        "repository_asr_match_score": float(((evidence.get("audio_asr") or {}).get("best_match") or {}).get("score") or 0.0),\n        "repository_ocr_match_score": float(((evidence.get("visual_evidence") or {}).get("best_match") or {}).get("score") or 0.0),\n        "repository_minimum_review_score": minimum,\n'
          if old not in text:
              raise SystemExit('accept patch marker 3 not found')
          text = text.replace(old, new, 1)
          old = '''            "Qualifying v2 record produced only after GitHub Actions decoded real media, "
            "offline Whisper located the target inside the decoded window, durable textual/visual "
            "evidence was written to Git, and the active playback claim owner explicitly reviewed "
'''
          new = '''            "Qualifying v2 record produced only after GitHub Actions decoded real media, "
            "repository ASR/OCR inspection located a review candidate inside the decoded window, "
            "durable textual/visual evidence was written to Git, and the active playback claim owner explicitly reviewed "
'''
          if old not in text:
              raise SystemExit('accept patch marker 4 not found')
          text = text.replace(old, new, 1)
          a.write_text(text, encoding='utf-8')
          PY
      - name: Run existing focused regression tests
        run: |
          python tests/test_playback_service_state.py
          python tests/test_audit_media.py
      - name: Commit patch and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/admin-visual-match-patch-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/process_playback_request.py scripts/accept_playback_evidence.py .github/workflows/admin-visual-match-patch-once.yml
          git commit -m 'fix: use frame OCR for playback review candidates'
          git pull --rebase origin main
          git push origin HEAD:main
