name: Admin Visual Match Patch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-visual-match-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply playback OCR candidate patch
        run: python scripts/admin_patch_visual_match_once.py
      - name: Run existing focused regression tests
        run: |
          python tests/test_playback_service_state.py
          python tests/test_audit_media.py
      - name: Commit patch and retire one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/admin-visual-match-patch-once.yml scripts/admin_patch_visual_match_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/process_playback_request.py scripts/accept_playback_evidence.py .github/workflows/admin-visual-match-patch-once.yml scripts/admin_patch_visual_match_once.py
          git commit -m 'fix: use frame OCR for playback review candidates'
          git pull --rebase origin main
          git push origin HEAD:main
