name: Build Pilot SQLite

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'coordination/claims/**'
      - 'coordination/completed/**'
      - 'schema/**'
      - 'scripts/build_db.py'
      - 'scripts/validate_db.py'
      - 'scripts/audit_media.py'
      - 'scripts/project_status.py'
      - 'tests/**'
      - '.github/workflows/pilot-db.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'coordination/claims/**'
      - 'coordination/completed/**'
      - 'schema/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/pilot-db.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pilot-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate candidate-review evidence
        run: python scripts/validate_candidate_reviews.py

      - name: Build SQLite from Git-tracked source data
        run: python scripts/build_db.py

      - name: Validate SQLite
        run: python scripts/validate_db.py

      - name: Commit rebuilt Pilot database
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/Miles-Guo_public_archive.sqlite3
          if git diff --cached --quiet; then
            echo "Pilot SQLite is already current."
          else
            git commit -m "build: refresh Pilot SQLite database"
            rebuild_base="$(git rev-parse HEAD^)"
            if git push; then
              exit 0
            fi
            git fetch origin main
            if git merge-base --is-ancestor "$rebuild_base" origin/main; then
              echo "main advanced during this rebuild; its newer push triggered a fresh run."
              echo "Treating this non-fast-forward as a concurrency handoff, not a build failure."
              exit 0
            fi
            echo "Database push failed for a reason other than a normal concurrent main advance."
            exit 1
          fi
